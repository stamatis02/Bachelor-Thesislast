name: tests

on:
  workflow_dispatch:
  push:
    paths: ["youtube_virality_engine.py", "test_pipeline_mock.py"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install pandas openpyxl google-api-python-client scikit-learn joblib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Built-in self-test
        run: python youtube_virality_engine.py --self-test 2>&1 | grep -E "PASS|FAIL|SELF-TEST"
      - name: End-to-end mock pipeline test
        run: python test_pipeline_mock.py 2>&1 | grep -vE "\| (INFO|DEBUG|WARNING) "
