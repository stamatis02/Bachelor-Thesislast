name: virality-engine

on:
  # Triggered every 2 hours by cron-job.org via the workflow_dispatch API.
  # GitHub's own `schedule` was dropped: on free accounts it fired only every
  # 6-8 hours, which made many 8h/24h/72h checkpoints MISSED.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: virality-engine       # never two cycles writing the dataset at once
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only PyTorch wheel (~200 MB instead of ~2 GB with CUDA).
      - run: |
          pip install pandas openpyxl google-api-python-client scikit-learn joblib
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Full cycle: collect + label + train + predict. Every fresh 8h video gets a
      # probability BEFORE its 72h label exists — a true out-of-sample test.
      - name: Run one cycle
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_virality_engine.py --once

      - name: Commit dataset
        run: |
          git config user.name "virality-engine"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "cycle $(date -u +%FT%TZ)"
          git push
