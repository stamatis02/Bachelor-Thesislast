name: thesis-experiments

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: virality-engine       # never run while a collection cycle is writing
  cancel-in-progress: false

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install pandas openpyxl google-api-python-client scikit-learn joblib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run thesis experiments
        run: python experiments/thesis_experiments.py 2>&1 | grep -v "| DEBUG" | tee experiments_run.log
      - name: Commit results
        run: |
          git config user.name "virality-engine"
          git config user.email "bot@users.noreply.github.com"
          git add experiments/results
          git diff --staged --quiet || git commit -m "thesis experiments $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push
